name: Build Windows App

# Windows 用の単一実行ファイル (.exe) をクラウドでビルドする。
# - 手動実行（Actions タブ → Run workflow）
# - タグ push（v* ）時に Release へ添付
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    tags:
      - "v*"

permissions:
  contents: write   # Release の作成・更新に必要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable (pptx-vectorizer)
        run: pyinstaller --noconfirm pptx_vectorizer.spec

      - name: Build executable (audio-transcriber)
        run: pyinstaller --noconfirm audio_transcriber.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-apps
          path: |
            dist/pptx-vectorizer.exe
            dist/audio-transcriber.exe

      # タグ push 時は通常リリースへ添付
      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pptx-vectorizer.exe
            dist/audio-transcriber.exe

      # ブランチ push / 手動実行時は固定タグ「windows-latest」のリリースを更新。
      # Release のアセットなら、ログイン不要・スマホでもクリックして DL できる。
      - name: Publish latest Windows build
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Windows 最新ビルド (.exe)
          body: |
            Windows 用の実行ファイルです（Python のインストール不要）。
            下の Assets からクリックしてダウンロードし、ダブルクリックで起動してください。

            - `pptx-vectorizer.exe` … PPTX 画像→図形 変換ツール
            - `audio-transcriber.exe` … 音声文字起こし＋推敲アプリ
              （初回起動時に OpenAI の API キーを入力してください）
          prerelease: true
          files: |
            dist/pptx-vectorizer.exe
            dist/audio-transcriber.exe
