[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-vectorizer"
version = "0.1.0"
description = "PPT 内の画像を編集可能な図形オブジェクトに変換するツール（CLI/GUI）"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-pptx>=0.6.21",
    "opencv-python-headless>=4.5",
    "numpy>=1.21",
]

[project.scripts]
pptx-vectorize = "pptx_vectorizer.cli:main"

[project.gui-scripts]
pptx-vectorize-gui = "pptx_vectorizer.gui:main"

[tool.setuptools]
packages = ["pptx_vectorizer"]
