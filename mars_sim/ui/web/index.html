<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TERRA ASCENDANT — 観測モード</title>
<!--__RUN_DATA__-->
<style>
  :root{
    --bg:#070912; --panel:#0e1322; --panel2:#131a2e; --line:#243049;
    --ink:#dfe6f5; --dim:#8a97b5; --accent:#7aa2ff; --warn:#e0524f;
    --gold:#e8c879; --good:#46c39a; --god:#c08bff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 800px at 70% -10%,#101936,#070912 60%);
    color:var(--ink);font-family:"Segoe UI",system-ui,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
  header{display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;letter-spacing:.06em}
  header .sub{color:var(--dim);font-size:12px}
  .wrap{display:grid;grid-template-columns:560px 1fr;gap:14px;padding:14px;align-items:start}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:10px;padding:12px}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.08em}
  canvas#sky{width:536px;height:536px;display:block;margin:0 auto;border-radius:8px;background:
    radial-gradient(420px 420px at 50% 50%,#0b1024,#05070f)}
  .yearbadge{position:relative}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
  .kpi{display:flex;flex-direction:column;gap:3px}
  .kpi .top{display:flex;justify-content:space-between;font-size:12px}
  .kpi .top b{font-variant-numeric:tabular-nums}
  .bar{height:6px;background:#0a0f1e;border-radius:4px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:4px}
  .nation{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;position:relative}
  .nation .nm{display:flex;align-items:center;gap:8px;font-size:13px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .pips{letter-spacing:2px;font-size:13px}
  .meta{color:var(--dim);font-size:11px;display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
  .badge{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--accent)}
  .chron{height:230px;overflow:auto;font-size:12.5px;line-height:1.7;padding-right:6px}
  .chron .e{padding:1px 2px;border-radius:4px}
  .chron .milestone{color:var(--gold)} .chron .accident{color:var(--warn)}
  .chron .god{color:var(--god)} .chron .tech{color:var(--good)}
  .chron .mission{color:var(--accent)} .chron .diplomacy{color:#7fd4ff} .chron .info{color:var(--dim)}
  .flash{animation:fl 1.1s ease-out}
  @keyframes fl{from{background:#2a3a66}to{background:transparent}}
  .controls{display:flex;align-items:center;gap:12px;margin-top:10px}
  button{background:#1b2540;color:var(--ink);border:1px solid var(--line);border-radius:7px;
    padding:6px 14px;cursor:pointer;font-size:13px}
  button:hover{background:#243152}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .speed{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .outcome{margin-top:8px;font-size:13px;color:var(--gold);min-height:18px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--dim);justify-content:center;margin-top:6px}
  .legend span{display:flex;align-items:center;gap:5px}
</style>
</head>
<body>
<header>
  <h1>TERRA ASCENDANT</h1>
  <div class="sub" id="runinfo">観測モード — 人類の宇宙進出を鑑賞する</div>
</header>

<div class="wrap">
  <div class="card">
    <h2>太陽系俯瞰 <span id="winlabel" style="color:var(--gold)"></span></h2>
    <canvas id="sky" width="536" height="536"></canvas>
    <div class="legend" id="legend"></div>
    <div class="controls">
      <button id="play">▶ 再生</button>
      <input type="range" id="scrub" min="0" value="0">
      <div class="speed">速度<input type="range" id="speed" min="0.5" max="8" step="0.5" value="2" style="width:80px"><span id="speedv">2.0</span>/秒</div>
    </div>
    <div class="outcome" id="outcome"></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
      <h2>人類指標 <span style="float:right;color:var(--ink)" id="yearbig"></span></h2>
      <div class="kpis" id="kpis"></div>
    </div>
    <div class="card">
      <h2>勢力</h2>
      <div id="nations"></div>
    </div>
    <div class="card">
      <h2>年代記</h2>
      <div class="chron" id="chron"></div>
    </div>
  </div>
</div>

<script>
const KPI = [
  {k:"spacefaring",  label:"宇宙進出力", max:100, color:"#7aa2ff"},
  {k:"self_sufficiency",label:"火星自立度", max:100, color:"#46c39a"},
  {k:"public_will",  label:"宇宙への世論", max:100, color:"#e8c879"},
  {k:"cohesion",     label:"地球協調度", max:100, color:"#7fd4ff"},
  {k:"knowledge",    label:"科学知",     max:100, color:"#9be36b"},
  {k:"mandate",      label:"天命(Mandate)", max:100, color:"#c08bff"},
  {k:"risk_debt",    label:"リスク負債", max:100, color:"#e0524f"},
  {k:"offworld_pop", label:"地球外人口", max:null, color:"#ffb27a"},
];
const STAGE_JA = {build:"建造",await_window:"窓待ち",transit:"遷移中",edl:"着陸接近"};
const DEST_JA = {moon:"月",mars:"火星"};

function boot(run){
  const frames = run.frames, meta = run.meta;
  const colors = meta.nation_colors;
  document.getElementById("runinfo").textContent =
    `観測モード — 自国:${frames[0].nations.find(n=>n.is_player).name} / 自国AI:${meta.player_doctrine} / 運命:${meta.fate} / seed:${meta.seed}`;
  const scrub = document.getElementById("scrub");
  scrub.max = frames.length - 1;

  // 凡例
  document.getElementById("legend").innerHTML =
    frames[0].nations.map(n=>`<span><i class="dot" style="background:${colors[n.id]}"></i>${n.name}${n.is_player?"（自国）":""}</span>`).join("")
    + `<span>△有人 ▫無人</span>`;

  // KPIの最大値（人口など可変スケール用）
  const popMax = Math.max(10, ...frames.map(f=>f.kpi.offworld_pop));

  // ---- 太陽系描画 ----
  const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, CX = W/2, CY = H/2, R = W/2 - 28;
  const orbit = {earth: R*0.40, mars: R*0.72};
  const period = {earth:1.0, mars:1.881};
  function planetPos(name, yearFloat){
    const yrs = yearFloat - meta.start_year;
    const ang = -2*Math.PI * yrs / period[name] + (name==="mars"? 0.9 : 0.0);
    return {x: CX + orbit[name]*Math.cos(ang), y: CY + orbit[name]*Math.sin(ang), ang};
  }
  function drawSky(idx, p){
    const f = frames[idx];
    const yearFloat = f.year + (idx<frames.length-1 ? p : 0);
    ctx.clearRect(0,0,W,H);
    // 星
    ctx.save();
    for(let i=0;i<80;i++){const x=(i*97%W),y=(i*53%H);ctx.fillStyle="rgba(255,255,255,"+(0.04+(i%5)*0.02)+")";ctx.fillRect(x,y,1,1);}
    ctx.restore();
    // 軌道
    ctx.strokeStyle="#1d2742"; ctx.lineWidth=1;
    for(const o of [orbit.earth, orbit.mars]){ctx.beginPath();ctx.arc(CX,CY,o,0,7);ctx.stroke();}
    // 太陽
    const sg=ctx.createRadialGradient(CX,CY,2,CX,CY,16);sg.addColorStop(0,"#fff3c0");sg.addColorStop(1,"#e9a23b");
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(CX,CY,8,0,7);ctx.fill();
    const E=planetPos("earth",yearFloat), M=planetPos("mars",yearFloat);
    // 火星打ち上げ窓：転送回廊を光らせる
    if(f.mars_window){
      ctx.strokeStyle="rgba(232,200,121,0.5)";ctx.lineWidth=2;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.moveTo(E.x,E.y);ctx.lineTo(M.x,M.y);ctx.stroke();ctx.setLineDash([]);
    }
    // 火星
    ctx.fillStyle="#d9603f";ctx.beginPath();ctx.arc(M.x,M.y,7,0,7);ctx.fill();
    ctx.fillStyle="#88324f";ctx.font="10px sans-serif";ctx.fillText("火星",M.x+9,M.y+3);
    // 地球＋月
    ctx.fillStyle="#4f8bf0";ctx.beginPath();ctx.arc(E.x,E.y,7,0,7);ctx.fill();
    const moonAng=-2*Math.PI*((yearFloat-meta.start_year)/0.18);
    const mo={x:E.x+18*Math.cos(moonAng),y:E.y+18*Math.sin(moonAng)};
    ctx.fillStyle="#cdd3e0";ctx.beginPath();ctx.arc(mo.x,mo.y,2.5,0,7);ctx.fill();
    ctx.fillStyle="#5b7fbf";ctx.fillText("地球",E.x+9,E.y-7);
    // ミッション（船）
    const stageT = {build:0.06,await_window:0.10,transit:0.5,edl:0.9};
    f.nations.forEach((n,i)=>{
      if(!n.mission) return;
      const col = colors[n.id];
      let pos;
      if(n.mission.dest==="mars"){
        const t = stageT[n.mission.stage] ?? 0.3;
        pos = {x: E.x+(M.x-E.x)*t, y: E.y+(M.y-E.y)*t};
      } else { // 月
        const t = (n.mission.stage==="build")?0.2:0.85;
        pos = {x:E.x+(mo.x-E.x)*t, y:E.y+(mo.y-E.y)*t};
      }
      ctx.fillStyle=col; ctx.strokeStyle=col;
      if(n.mission.kind==="crewed"){
        ctx.beginPath();ctx.moveTo(pos.x,pos.y-4);ctx.lineTo(pos.x-3.5,pos.y+3);ctx.lineTo(pos.x+3.5,pos.y+3);ctx.closePath();ctx.fill();
      } else { ctx.fillRect(pos.x-3,pos.y-3,6,6); }
    });
    // 宇宙の冬
    if(f.space_winter){ctx.fillStyle="rgba(120,160,255,0.10)";ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#9fb6ff";ctx.font="13px sans-serif";ctx.fillText("❄ 宇宙の冬",CX-34,H-14);}
    document.getElementById("winlabel").textContent = f.mars_window ? "● 火星打ち上げ窓 開放中" : "";
  }

  // ---- ダッシュボード ----
  function sparkPath(key, idx){
    // 直近のhistoryをパス文字列に（簡易）
    const n = Math.min(idx+1, frames.length); const w=70,h=18;
    let mx = (key==="offworld_pop")?popMax:(KPI.find(x=>x.k===key).max||100);
    let pts=[];
    for(let i=0;i<n;i++){const v=frames[i].kpi[key];pts.push([i/(Math.max(1,frames.length-1))*w, h-(v/mx)*h]);}
    return pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  }
  function renderKpis(idx){
    const f=frames[idx];
    document.getElementById("kpis").innerHTML = KPI.map(m=>{
      const v=f.kpi[m.k]; const mx=(m.k==="offworld_pop")?popMax:m.max;
      const pct=Math.max(0,Math.min(100,(v/mx)*100));
      const disp=(m.k==="offworld_pop")?v:v.toFixed(0);
      return `<div class="kpi"><div class="top"><span>${m.label}</span><b>${disp}</b></div>
        <div class="bar"><i style="width:${pct}%;background:${m.color}"></i></div>
        <svg width="100%" height="18" viewBox="0 0 70 18" preserveAspectRatio="none">
          <path d="${sparkPath(m.k,idx)}" fill="none" stroke="${m.color}" stroke-width="1" opacity="0.7"/></svg></div>`;
    }).join("");
    document.getElementById("yearbig").textContent = f.year + "年";
  }

  // ---- 勢力パネル ----
  function renderNations(idx){
    const f=frames[idx];
    document.getElementById("nations").innerHTML = f.nations.map(n=>{
      const pips = meta.milestones.map(ms=>n.reached.includes(ms.key)?"●":"○").join("");
      const mission = n.mission ? `<span class="badge">${DEST_JA[n.mission.dest]}${STAGE_JA[n.mission.stage]}${n.mission.kind==="crewed"?"・有人":""}</span>`:"";
      return `<div class="nation">
        <div class="nm"><i class="dot" style="background:${colors[n.id]}"></i><b>${n.name}</b>${n.is_player?'<span class="badge">自国</span>':''} ${mission}</div>
        <div class="pips" style="color:${colors[n.id]}">${pips}</div>
        <div class="meta"><span>技術 ${n.capability}</span><span>進出 ${n.spacefaring}</span><span>資金 ${n.treasury}</span><span>研究 ${n.tech_count}</span><span>リスク ${n.risk_debt}</span></div>
      </div>`;
    }).join("");
  }

  // ---- 年代記 ----
  const chronEl = document.getElementById("chron");
  const MARK = {milestone:"★",accident:"✖",god:"⚡",tech:"✦",mission:"»",diplomacy:"🤝",info:"・"};
  function renderChron(idx, flashLast){
    let html="";
    for(let i=0;i<=idx;i++) for(const e of frames[i].events)
      html += `<div class="e ${e.kind} ${(flashLast&&i===idx)?'flash':''}">${e.year}年 ${MARK[e.kind]||"・"} ${e.text}</div>`;
    chronEl.innerHTML = html;
    chronEl.scrollTop = chronEl.scrollHeight;
  }

  function renderOutcome(idx){
    if(idx<frames.length-1){document.getElementById("outcome").textContent="";return;}
    const f=frames[idx]; let msg;
    const any=key=>f.nations.some(n=>n.reached.includes(key));
    if(f.space_winter) msg="❄ 人類は揺りかごに引きこもった（宇宙の冬）。";
    else if(any("mars_settlement")) msg="★ 人類は火星に根を下ろした——多惑星種への第一歩。";
    else if(any("mars_landing")) msg="赤い惑星に最初の足跡。だが定住への道はまだ遠い。";
    else msg="火星到達は未達。歴史はまだ途上にある。";
    document.getElementById("outcome").textContent = msg;
  }

  // ---- 再生ループ ----
  let idx=0, playing=false, speed=2, acc=0, last=performance.now();
  function setFrame(i, flash){
    idx=i; scrub.value=i;
    renderKpis(i); renderNations(i); renderChron(i, flash); renderOutcome(i);
  }
  function loop(now){
    const dt=(now-last)/1000; last=now;
    let p=0;
    if(playing){
      acc += dt*speed;
      while(acc>=1 && idx<frames.length-1){acc-=1; setFrame(idx+1, true);}
      if(idx>=frames.length-1){playing=false; document.getElementById("play").textContent="▶ 再生";}
      p=acc;
    }
    drawSky(idx, p);
    requestAnimationFrame(loop);
  }

  document.getElementById("play").onclick=()=>{
    if(idx>=frames.length-1){setFrame(0,false);acc=0;}
    playing=!playing; document.getElementById("play").textContent= playing?"❚❚ 一時停止":"▶ 再生";
  };
  scrub.oninput=e=>{playing=false;document.getElementById("play").textContent="▶ 再生";acc=0;setFrame(+e.target.value,false);};
  const sp=document.getElementById("speed");
  sp.oninput=e=>{speed=+e.target.value;document.getElementById("speedv").textContent=speed.toFixed(1);};

  setFrame(0,false);
  requestAnimationFrame(loop);
}

// データ：埋め込み(window.__RUN__) 優先、無ければ run.json を取得
if(window.__RUN__) boot(window.__RUN__);
else fetch("run.json").then(r=>r.json()).then(boot).catch(err=>{
  document.body.insertAdjacentHTML("beforeend","<p style='color:#e0524f;padding:18px'>run.json を読み込めませんでした。terra_sim.viz で書き出すか、自己完結HTMLを生成してください。</p>");
});
</script>
</body>
</html>
